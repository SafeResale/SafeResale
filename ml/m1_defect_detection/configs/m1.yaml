# M1 defect detection — YOLO data config
# Point at your prepared dataset dir (YOLO layout: train/images, val/images + labels).
# This file is generated/overwritten by download_dataset.py — edit only for manual datasets.
path: data/datasets/defects   # relative to the m1_defect_detection dir
train: train/images
val: val/images
test: test/images

# Classes — core set (14, from docs/08-ml-plan.md §3.1). Cross-category + box-localizable.
# Train ONLY classes with ≥100 annotated instances. Category-specific extensions (15) are
# excluded from M1 v1: stain, discoloration, wear, broken_part, missing_part, button_damage,
# keyboard_damage, hinge_damage, cable_damage, connector_damage, tire_damage, wheel_damage,
# mirror_damage, light_damage, bumper_damage.
# Rename to match your dataset's actual classes (keep order consistent with labels/*.txt).
names:
  0: scratch
  1: crack
  2: dent
  3: screen_damage
  4: glass_damage
  5: camera_damage
  6: port_damage
  7: casing_damage
  8: body_deformation
  9: paint_damage
  10: chip
  11: rust
  12: corrosion
  13: water_damage
