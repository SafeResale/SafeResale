# M1 defect detection — YOLO data config
# Point at your prepared dataset dir (YOLO layout: train/images, val/images + labels).
# This file is generated/overwritten by download_dataset.py — edit only for manual datasets.
# names must match the merged dataset's data.yaml (see prepare_dataset.py) — here the 5
# classes that cleared the >=100-instance threshold in the 2026-08 merge (CarDD + cracked_screen).
path: data/datasets/defects   # relative to the m1_defect_detection dir
train: train/images
val: val/images
test: test/images

# Classes — from docs/08-ml-plan.md §3.1 (core 14). Only classes with >=100 boxes are trained;
# the rest (camera_damage, port_damage, casing_damage, body_deformation, paint_damage, chip,
# rust, corrosion, water_damage) had <100 boxes in the 2026-08 merge and are deferred until
# more per-class data lands (plan §3.1.1 "category coverage"). Order MUST match data.yaml/labels.
names:
  0: scratch
  1: crack
  2: dent
  3: screen_damage
  4: glass_damage
