# M1 defect detection — YOLO data config
# Point at your prepared dataset dir (YOLO layout: train/images, val/images + labels).
# This file is generated/overwritten by download_dataset.py — edit only for manual datasets.
# names must match the merged dataset's data.yaml (see prepare_dataset.py) — here the 8
# classes that cleared the >=100-instance threshold in the 2026-09 merge (CarDD + cracked_screen
# + mobile_damage + corrosion_v1 + water_damage + rust + laptop_newv + laptop_crack +
# mvtec_yolo + negatives_kaggle).
path: data/datasets/defects   # relative to the m1_defect_detection dir
train: train/images
val: val/images
test: test/images

# Classes — from docs/08-ml-plan.md §3.1 (core 14). Order MUST match data.yaml/labels.
names:
  0: scratch
  1: crack
  2: dent
  3: screen_damage
  4: glass_damage
  5: rust
  6: corrosion
  7: water_damage