# SafeResale ML services — docker compose (docs/10-setup-guide.md §8.2)
#
# GPU: Docker Desktop with WSL2 + NVIDIA Container Toolkit, or Linux + nvidia-container-toolkit.
#   Docker Desktop: Settings → Resources → WSL Integration → GPU acceleration.
#   Linux: sudo apt install nvidia-container-toolkit && sudo nvidia-ctk runtime configure --runtime=docker
#
# Common commands:
#   build image:            docker compose -f ml/docker-compose.yml build
#   verify GPU in container:docker compose -f ml/docker-compose.yml run --rm ml
#   smoke test (1 epoch):   docker compose -f ml/docker-compose.yml run --rm smoke
#   train M1:               docker compose -f ml/docker-compose.yml run --rm ml train
#   jupyter lab:            docker compose -f ml/docker-compose.yml up lab  (open http://localhost:8888)
#
# Data/weights/runs persist in named volumes + a bind mount for downloads, so nothing big is baked into the image.

services:
  ml:
    build:
      context: ..
      dockerfile: ml/Dockerfile
    image: saferesale/ml:latest
    working_dir: /ml/m1_defect_detection
    environment:
      # Code/data live at /ml (in image + volumes); work root for runs/datasets.
      M1_WORK_ROOT: /ml/work
      WANDB_MODE: disabled
      YOLO_CONFIG_DIR: /ml/work
    volumes:
      - ml_data:/ml/work                       # datasets, weights, runs (persist between runs)
      - ../ml/m1_defect_detection/data:/ml/data/m1  # optional bind for manual data drops
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: ["-c", "import torch; print('torch', torch.__version__, '| cuda:', torch.cuda.is_available())"]

  smoke:
    build:
      context: ..
      dockerfile: ml/Dockerfile
    image: saferesale/ml:latest
    working_dir: /ml/m1_defect_detection
    environment:
      M1_WORK_ROOT: /ml/work
      WANDB_MODE: disabled
      YOLO_CONFIG_DIR: /ml/work
    volumes:
      - ml_data:/ml/work
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: ["scripts/smoke_test.py"]

  train:
    build:
      context: ..
      dockerfile: ml/Dockerfile
    image: saferesale/ml:latest
    working_dir: /ml/m1_defect_detection
    environment:
      M1_WORK_ROOT: /ml/work
      WANDB_MODE: disabled
      YOLO_CONFIG_DIR: /ml/work
    volumes:
      - ml_data:/ml/work
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: ["scripts/train.py", "--yaml", "configs/m1.yaml", "--epochs", "50"]

  lab:
    build:
      context: ..
      dockerfile: ml/Dockerfile
    image: saferesale/ml:latest
    working_dir: /ml/m1_defect_detection
    environment:
      M1_WORK_ROOT: /ml/work
      WANDB_MODE: disabled
      YOLO_CONFIG_DIR: /ml/work
    volumes:
      - ml_data:/ml/work
    ports:
      - "8888:8888"
    command: ["-m", "jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--allow-root", "--no-browser"]

  # ---- M2 condition classification (TensorFlow / Keras 3) ----
  # Image is built from ml/Dockerfile.m2 (official tensorflow/tensorflow:2.21.0-gpu).
  # Data/weights/runs persist in ml_data_m2 (never baked into the image).

  m2:
    build:
      context: ..
      dockerfile: ml/Dockerfile.m2
    image: saferesale/ml-m2:latest
    working_dir: /ml/m2_condition_classification
    environment:
      M2_WORK_ROOT: /ml/work
      WANDB_MODE: disabled
    volumes:
      - ml_data_m2:/ml/work                       # datasets, weights, runs (persist between runs)
      - ../ml/m2_condition_classification/data:/ml/data/m2  # optional bind for manual data drops
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: ["-c", "import tensorflow as tf; gpus = tf.config.list_physical_devices('GPU'); print('tensorflow', tf.__version__, '| gpu:', len(gpus) > 0, '|', [g.name for g in gpus])"]

  m2-smoke:
    build:
      context: ..
      dockerfile: ml/Dockerfile.m2
    image: saferesale/ml-m2:latest
    working_dir: /ml/m2_condition_classification
    environment:
      M2_WORK_ROOT: /ml/work
      WANDB_MODE: disabled
    volumes:
      - ml_data_m2:/ml/work
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: ["scripts/smoke_test.py"]

  m2-train:
    build:
      context: ..
      dockerfile: ml/Dockerfile.m2
    image: saferesale/ml-m2:latest
    working_dir: /ml/m2_condition_classification
    environment:
      M2_WORK_ROOT: /ml/work
      WANDB_MODE: disabled
    volumes:
      - ml_data_m2:/ml/work
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: ["scripts/train.py", "--yaml", "configs/m2.yaml", "--epochs", "50"]

volumes:
  ml_data:
  ml_data_m2:
